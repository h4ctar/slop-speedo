kibot:
    version: 1

import:
    - file: JLCPCB

globals:
    dir: generated
    filters:
        - number: 135
          regex: 'Part field mismatch'
          filter: 'SCH Part field holds descriptions, PCB Part field holds MPNs; KiBot adopts the PCB value'

preflight:
    check_zone_fills: true

    erc:
        filters:
            - error: lib_symbol_issues

    drc:
        filters:
            - error: lib_footprint_issues

outputs:
    - name: pcbdraw-front
      type: pcbdraw

    - name: pcbdraw-back
      type: pcbdraw
      options:
          bottom: true
